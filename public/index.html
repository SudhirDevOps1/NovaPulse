<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Kestrel — Uptime Monitoring</title>
    <meta
      name="description"
      content="Kestrel — self-hosted uptime monitoring with percentile analytics, SSL checks, status pages and alerts."
    />
    <meta
      name="theme-color"
      content="#070c17"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#eef2f9"
      media="(prefers-color-scheme: light)"
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
        <a class="brand" href="#/overview">
          <span class="brand-mark">
            <svg class="icon icon-lg" viewBox="0 0 64 64" aria-hidden="true">
              <path
                d="M32 8 16 26 4 34l16 0 8-4 4 14 4-14 8 4 16 0-12-8Z"
                fill="none"
                stroke="currentColor"
                stroke-width="4.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span class="brand-text">
            Kestrel
            <small>uptime watch</small>
          </span>
        </a>

        <nav class="nav">
          <span class="nav-label">Menu</span>
          <a href="#/overview" data-nav="overview">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 14 16.5 8.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M3.5 18a9 9 0 1 1 17 0"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
            Overview
          </a>
          <a href="#/monitors" data-nav="monitors">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect
                x="3"
                y="4"
                width="18"
                height="7"
                rx="2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <rect
                x="3"
                y="13"
                width="18"
                height="7"
                rx="2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              />
            </svg>
            Monitors
            <span class="nav-count" id="nav-monitors">0</span>
          </a>
          <a href="#/incidents" data-nav="incidents">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
              <path
                d="M12 9v4M12 17h.01"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
            Incidents
            <span class="nav-count" id="nav-incidents">0</span>
          </a>
          <a href="#/settings" data-nav="settings">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
            Settings
          </a>
        </nav>

        <div class="sidebar-foot">
          <div class="api-status" id="api-status">
            <span class="dot"></span>
            <span id="api-label">connecting…</span>
          </div>
          <div class="foot-row">
            <button
              class="icon-btn bare"
              id="theme-toggle"
              aria-label="Toggle color theme"
            >
              <svg
                class="icon"
                id="theme-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <span class="version" id="version-label">v—</span>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button
            class="icon-btn menu-btn"
            id="menu-btn"
            aria-label="Open navigation"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3 6h18M3 12h18M3 18h18"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <div class="page-title">
            <h1 id="page-title">Overview</h1>
            <p id="page-sub">Fleet health at a glance</p>
          </div>

          <div class="topbar-actions">
            <span class="refresh-info" id="last-updated">—</span>
            <button class="icon-btn" id="refresh-btn" aria-label="Refresh data">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M21 4v6h-6M20.5 14a8.5 8.5 0 1 1-2-8.6L21 8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button class="btn btn-primary" id="new-monitor-btn">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 5v14M5 12h14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
              <span class="btn-label">New monitor</span>
            </button>
          </div>
        </header>

        <main class="view" id="view" tabindex="-1">
          <div class="tiles">
            <div class="card tile skeleton tall"></div>
            <div class="card tile skeleton tall"></div>
            <div class="card tile skeleton tall"></div>
            <div class="card tile skeleton tall"></div>
          </div>
          <div class="card skeleton skeleton-hero"></div>
        </main>
      </div>
    </div>

    <div id="drawer-root" class="drawer-root"></div>
    <div id="modal-root" class="modal-root"></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
