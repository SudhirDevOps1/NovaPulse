# CodeQL query configuration for NovaPulse.
#
# Scope is deliberately narrow: this repo is JavaScript/TypeScript only, and we
# query for the bug classes that actually matter for an HTTP probing service
# (injection, unsafe deserialisation, prototype pollution, path traversal,
# hardcoded credentials) rather than running the full default suite and
# drowning the signal in style-level noise.
name: NovaPulse CodeQL

disable-default-queries: false

queries:
  # Built-in suite names are hyphenated (`security-extended`, not
  # `security/extended`): a slash makes the CodeQL CLI parse the value as an
  # external repository specifier and abort database init with
  # "Specifier for external repository is invalid: security/extended".
  # Extra precision on top of the default security suite:
  - uses: security-extended
  - uses: security-and-quality

paths:
  - lib
  - public
  - tools
  - test
  - server.js

paths-ignore:
  - node_modules
  - site
  - gh-state
  - data
  - "**/*.min.js"

# `javascript` and `typescript` share an extractor in CodeQL v2+, so the
# workflow declares `languages: javascript-typescript` once on the init step.
# There is deliberately no `languages:` key above: it is not a configuration
# file property, and CodeQL prints "Invalid property specified … Ignoring it"
# for it on every run.
