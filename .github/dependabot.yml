# Weekly dependency freshness: GitHub opens version-bump PRs for direct
# dependencies. Security advisories surface separately as Dependabot alerts,
# which this schedule does not gate anything on.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    # Single-package repo: no need for 10 concurrent update PRs.
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: deps
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
