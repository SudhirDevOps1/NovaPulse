# ═══════════════════════════════════════════════════════════════════════════
# DARWAZA 2 — Heavy PR Gate (E2E + DAST)
# ═══════════════════════════════════════════════════════════════════════════
# Runs against Pull Requests that target `main`, and against pushes to `main`
# itself — an e2e/ZAP regression merged through an admin bypass used to go
# completely unnoticed. Darwaza 1 has already proven the code compiles, lints
# and passes unit tests. This gate answers the two questions Darwaza 1 cannot:
#
#   1. Does the real UI actually work end-to-end in a browser?
#      → Playwright, Desktop + Mobile viewports, artifacts on failure.
#   2. Does the running app leak anything an attacker can use?
#      → OWASP ZAP baseline scan (passive, safe — no active exploitation).
#
# ZAP baseline is PASSIVE by design: it replays the app's own traffic and
# reports header/cookie/CSP/information-disclosure findings. It never sends
# attack payloads, so it is safe to run against a freshly built container.
# ═══════════════════════════════════════════════════════════════════════════

name: Darwaza 2 · Heavy PR Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: darwaza2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  e2e:
    name: Playwright E2E (desktop + mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The server is started by playwright.config.mjs `webServer`, pointed at
      # an isolated temp data dir so E2E never touches a real monitors.json.
      - name: Run E2E suite
        run: pnpm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  zap:
    name: OWASP ZAP baseline (DAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Build the image and run it with a throwaway data volume — the scan
      # target is a genuinely production-shaped container, not `node server.js`
      # on the runner's host network.
      - name: Build scan target image
        run: docker build -t novapulse-zap .

      - name: Start scan target
        run: |
          set -euo pipefail
          docker run -d --name target \
            -e NODE_ENV=production \
            -e UPTIME_DATA_DIR=/app/data \
            -p 3000:3000 \
            novapulse-zap
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then
              echo "target healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::target container never became healthy"
          docker logs target
          exit 1

      - name: Seed a monitor so ZAP crawls a populated UI
        run: |
          set -euo pipefail
          curl -fsS -X POST http://localhost:3000/api/monitors \
            -H 'content-type: application/json' \
            -d '{"name":"ZAP seed","url":"https://example.com","intervalSec":60}' >/dev/null
          # enable the public status page — it is an unauthenticated attack surface
          curl -fsS -X PATCH http://localhost:3000/api/settings \
            -H 'content-type: application/json' \
            -d '{"statusPage":{"enabled":true,"title":"Status","message":"live"}}' >/dev/null

      # ghcr.io/zaproxy/zaproxy:stable is the official image; `baseline` is the
      # passive quick-scan — it replays the app's own traffic and never sends
      # attack payloads. Only inputs the action actually declares are set here
      # (BUG-2026-0006: `format`/`output_file` were ignored with a warning and
      # pointed the policy at a file ZAP never writes).
      #
      # allow_issue_writing: false — the PR gate reports through its own
      # policy step, annotations and the `zap_scan` artifact. Filing issues
      # needs `issues: write`, which this workflow deliberately does not hold;
      # attempting it aborted the scan step outright (BUG-2026-0006).
      # Darwaza 3 (security-scan.yml) is the workflow that owns issues.
      - name: Run ZAP baseline scan
        # v0.14.0+ uploads through the current artifact service — v0.12.0 died
        # on `Create Artifact Container failed: The artifact name zap_scan is
        # not valid` (BUG-2026-0006); v0.15.0 also runs on node24.
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          fail_action: false # report first; the policy step below enforces the gate
          allow_issue_writing: false
          artifact_name: zap_scan
        env:
          # The container must reach the target; the action runs in its own net.
          CI: true

      - name: Evaluate ZAP findings against the policy
        # The action leaves report_json.json (ZAP's JSON report) in the
        # workspace. Policy: risk 1-3 (Low/Medium/High — ZAP's default
        # configuration triages every such alert as WARN) fails the gate;
        # risk 0 (Informational) is reported as a notice but is non-blocking.
        # tools/zap-policy.js implements this and is covered by
        # test/zap-policy.test.js.
        if: always()
        run: node tools/zap-policy.js report_json.json

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            report_json.json
            report_md.md
            report_html.html
          retention-days: 14
          if-no-files-found: warn

      - name: Stop scan target
        if: always()
        run: docker rm -f target || true
