# ═══════════════════════════════════════════════════════════════════════════
# RELEASE GATE — Google release-please v4 & Zero-Defect Release Pipeline
# ═══════════════════════════════════════════════════════════════════════════

name: Release (release-please v4)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.ai/**'
      - '.agent/**'
  workflow_dispatch:
    inputs:
      release_as:
        description: 'Manual version override (e.g. 2026.2.0)'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # STAGE 1: 5-STAGE ZERO-DEFECT QUALITY GATE
  # ─────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: 5-Stage Zero-Defect Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 1. Install Dependencies (Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: 2. Typecheck (TypeScript --noEmit)
        run: pnpm run typecheck

      - name: 3. Lint (ESLint 0-warning policy)
        run: pnpm run lint

      - name: 4. Automated Tests (Unit & Integration)
        run: pnpm test

      - name: 5. Production Build (Static Artifact Bundle)
        run: pnpm run build

      - name: Assert Build Artifact Output
        run: pnpm run build:check

  # ─────────────────────────────────────────────────────────────────────────
  # STAGE 2: GOOGLE RELEASE-PLEASE V4 ENGINE
  # ─────────────────────────────────────────────────────────────────────────
  release-please:
    name: Google release-please v4
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ github.event.inputs.release_as || '' }}

      - name: Summarise Release Status
        env:
          RELEASES: ${{ steps.release.outputs.releases_created }}
          PR: ${{ steps.release.outputs.pr }}
          TAGS: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "## 🚀 Release Please Execution Summary"
            echo ""
            echo "- **Release Created**: \`${RELEASES:-false}\`"
            echo "- **Release Tag**: \`${TAGS:-none}\`"
            echo "- **Target Version**: \`${VERSION:-none}\`"
            echo "- **Release PR**: ${PR:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose Failure
        if: failure()
        run: |
          {
            echo "## ⚠️ release-please execution failed"
            echo ""
            echo "1. Verify **Settings → Actions → General → Workflow permissions** has enabled:"
            echo "   *\"Allow GitHub Actions to create and approve pull requests\"*."
            echo "2. Verify all commits on \`main\` conform strictly to Conventional Commits."
            echo "3. Verify \`release-please-config.json\` passes schema validation."
          } >> "$GITHUB_STEP_SUMMARY"
