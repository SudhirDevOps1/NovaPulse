# Plan A — serverless uptime monitoring (₹0, no credit card, never sleeps).
#
#  schedule (every 5 min) → tools/gh-check.js probes every monitor in
#                           config/monitors.json, records history, fires Telegram
#                           alerts, then force-pushes state to the `state`
#                           branch (a single commit — the repo never grows).
#  any run                → tools/gh-build.js rebuilds site/ from the fresh
#                           state and deploys it to GitHub Pages.
#  every run (push, schedule, manual) → probe, save state, rebuild site/ and
#                           deploy it to Pages. Probing used to be skipped on
#                           `push` (it only re-deployed the previous state), so
#                           a freshly edited config/monitors.json sat invisible
#                           until the next scheduled run — and this repo's
#                           schedule has been arriving hours late.
#
# First-time setup: Settings → Pages → Source: "GitHub Actions", then add
# TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID as repository secrets (optional).

name: Monitor

on:
  push:
    branches: [main, master]
    # Only paths that actually reach the deployed site. Doc/test/server pushes
    # do NOT trigger a Pages redeploy (the 5-min schedule still refreshes data).
    paths:
      - "config/**"
      - "public/**"
      - "site/**"
      - "tools/**"
      - ".github/workflows/monitor.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [probe, check, monitor]

permissions:
  contents: write
  pages: write
  id-token: write

# Queue runs instead of cancelling — a check run must never be killed midway.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the state push never hits shallow limits

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # History + incidents live on the `state` branch so main stays clean.
      # That tree is a full snapshot, so restore only gh-state/.
      - name: Restore previous state
        shell: bash
        run: |
          if git fetch origin state 2>/dev/null; then
            git checkout FETCH_HEAD -- gh-state 2>/dev/null \
              || echo "No gh-state on the state branch yet — starting fresh."
          else
            echo "No state branch yet — starting fresh."
          fi

      - name: Check monitors
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          LOG_LEVEL: info
        run: node tools/gh-check.js

      - name: Save state
        shell: bash
        run: |
          git config user.name "uptime-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A gh-state
          if git diff --cached --quiet; then
            echo "State unchanged."
          else
            git commit -m "chore(state): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Force-push keeps the branch at one commit — zero repo growth.
            git push --force origin HEAD:state
          fi

      - name: Build static site
        run: node tools/gh-build.js

      # actions/configure-pages cannot enable the site with the default
      # GITHUB_TOKEN (its `enablement` input needs a PAT or GitHub App token),
      # so ask the Pages API first and fail with the exact UI path instead of
      # the cryptic "Get Pages site failed" that configure-pages throws.
      - name: Verify Pages source is "GitHub Actions"
        shell: bash
        run: |
          tmp="$RUNNER_TEMP/pages.json"
          code=$(curl -sS -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = "200" ]; then
            build_type=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).build_type ?? 'unknown')" "$tmp")
            echo "Pages is enabled — build_type=$build_type"
            exit 0
          fi
          {
            echo "Pages API answered HTTP $code — the site does not exist, so this run cannot deploy."
            echo "Fix: repository Settings → Pages → Build and deployment → Source: 'GitHub Actions'."
          } >&2
          echo "::error title=GitHub Pages is not enabled::Settings → Pages → Build and deployment → Source must be 'GitHub Actions' (Pages API HTTP $code). See the header of .github/workflows/monitor.yml."
          {
            echo "## Monitor: GitHub Pages is not enabled"
            echo ""
            echo "The Pages API answered **HTTP $code**, so \`actions/configure-pages\` cannot build or deploy the status site."
            echo "Set **Settings → Pages → Build and deployment → Source: \`GitHub Actions\`** and re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
