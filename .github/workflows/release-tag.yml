# Publishes the GitHub release + tag after a release-please PR merges.
#
# Why the split: release-please's own POST /releases is rejected with
# "Resource not accessible by integration" from the github-actions
# environment (see release.yml for the measured evidence, runs
# 40174328094/40173517134), while the same token inside `gh release
# create` succeeds. So release.yml only manages the release PR
# (skip-github-release: true), and this workflow does the tagging.
#
# Gate: only runs when a MERGED pull request still carries the
# `autorelease: pending` label — which is what release-please labels its
# release PRs with and cannot lose here, since the action that normally
# swaps it for `autorelease: tagged` is skipped by the split above.

name: Release tag (publish v*)

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write # swap the autorelease label after a successful tag

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag-release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip unless the PR is a release-please release PR
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels="$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')"
          # NOTE: the label literally is "autorelease: pending" (with a space),
          # so the glob must carry it too — "autorelease:pending" (no space)
          # never matched and the gate skipped the merge of PR #30 (run
          # 40176507812 said "not a release PR (labels: autorelease: pending)").
          if [[ "$labels" != *"autorelease: pending"* ]]; then
            echo "not a release PR (labels: ${labels:-none}) — skipping"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release
        id: release
        if: steps.gate.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          version="$(node -e 'console.log(require("./.release-please-manifest.json")["."])')"
          created=false
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} already exists — nothing to do."
          else
            # Release notes straight from the release-please-maintained
            # changelog: the section heading for this version through to the
            # next heading, then strip the heading itself.
            notes="$(awk -v v="$version" '
              /^## \[/ {seen = ($0 ~ "\\[" v "]"); next}
              seen {print}
            ' .ai/CHANGELOG.md)"

            if [ -z "$notes" ]; then
              notes="NovaPulse ${version}"
            fi

            # Pin the tag to this PR's merge commit: on a pull_request closed
            # event GITHUB_SHA is exactly that merge SHA, so a racing merge
            # cannot move the tag to a different commit. (Do NOT --verify-tag:
            # the tag does not exist beforehand, and verify would abort every
            # release — measured with v2026.1.3, tag v2026.1.3 didn't exist.)
            gh release create "v${version}" \
              --title "v${version}" \
              --notes "$notes" \
              --target "$GITHUB_SHA"
            created=true
          fi

          {
            echo "## 🏷️ Tagged Release"
            echo ""
            echo "- **Tag**: \`v${version}\`"
            echo "- **Source**: release PR #${PR}"
          } >> "$GITHUB_STEP_SUMMARY"

          # Close release-please's loop: with skip-github-release the action
          # never swaps the label, and a merged release PR that still reads
          # `autorelease: pending` makes the next release.yml run abort with
          # "There are untagged, merged release PRs outstanding" (measured:
          # run 40177869155 blocked 2026.1.4 behind PR #30). Swap pending ->
          # tagged once the release is real.
          if gh pr edit "$PR" --remove-label "autorelease: pending" >/dev/null 2>&1; then
            gh pr edit "$PR" --add-label "autorelease: tagged" >/dev/null 2>&1 || true
            echo "labels: autorelease: pending -> tagged"
          else
            echo "label swap skipped (already tagged or label absent)"
          fi
