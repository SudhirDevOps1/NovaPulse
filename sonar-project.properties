# ═══════════════════════════════════════════════════════════════════════════
# SonarQube / SonarCloud project definition
# Consumed by .github/workflows/sonar.yml and by any local `sonar-scanner`.
# The host, token and (when different) project key come from repository
# secrets — never from this file.
# ═══════════════════════════════════════════════════════════════════════════

sonar.organization=sudhirdevops1
sonar.projectKey=SudhirDevOps1_NovaPulse
sonar.projectName=NovaPulse
sonar.projectVersion=2026.1.0

sonar.sources=server.js,lib,public/js,tools
sonar.tests=test,e2e
sonar.test.inclusions=test/**,**/*.test.js,e2e/**

# Coverage is produced by `node --test --experimental-test-coverage`
# (lcov at coverage/lcov.info) — the same command the workflow runs.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8

# Exclusions: vendored/generated output, build artefacts, data at rest.
sonar.exclusions=site/**,node_modules/**,data/**,gh-state/**,coverage/**,playwright-report/**,test-results/**,e2e/.tmp-data/**,public/js/config.js.bak

# Coverage scope: the suite that actually asserts behaviour. E2E is excluded
# because Playwright exercises a browser, not instrumented server code.
sonar.coverage.exclusions=tools/**,e2e/**
