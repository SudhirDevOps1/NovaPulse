# NovaPulse 2026 — Self-Hosted Uptime Kuma Style Docker Compose
# 24/7 Continuous Zero-Lag Monitoring Daemon
services:
  novapulse:
    build: .
    container_name: novapulse-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - UPTIME_DATA_DIR=/app/data
      # Optional Notification Webhooks
      # - TELEGRAM_BOT_TOKEN=
      # - TELEGRAM_CHAT_ID=
      # - DISCORD_WEBHOOK_URL=
      # - SLACK_WEBHOOK_URL=
      # - NTFY_URL=
      # Optional Cloud Database (Turso, Neon, Aiven)
      # - TURSO_DATABASE_URL=
      # - TURSO_AUTH_TOKEN=
      # - NEON_DATABASE_URL=
      # - AIVEN_DATABASE_URL=
      # Optional Upptime GitHub Issues Integration
      # - GITHUB_TOKEN=
      # - GITHUB_REPOSITORY=username/repo
      # Optional Google Maps Telemetry
      # - GOOGLE_MAPS_API_KEY=
    volumes:
      - novapulse-data:/app/data

volumes:
  novapulse-data:
    driver: local
